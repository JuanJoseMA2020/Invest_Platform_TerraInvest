<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="TerraInvest: plataforma de inversiones alternativas. Bot de trading, bot de futuros, señales y rendimientos.">
<title>TerraInvest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232dd4bf'/%3E%3Cstop offset='.5' stop-color='%234f8cff'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M6 21l6-7 5 5 9-10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>/* ============================================================ tokens */
:root{
  --bg:#06090f; --bg2:#0a0f18; --surface:#0f1522; --surface2:#151d2e; --surface3:#1b2539; --line:#1d2638; --line2:#2a3650;
  --text:#ecf1fa; --mute:#8b97ad; --faint:#58637a;
  --accent:#4f8cff; --accent2:#8b5cf6; --teal:#2dd4bf; --up:#22c58b; --down:#f4566b; --warn:#f5b544;
  --up-bg:rgba(34,197,139,.12); --down-bg:rgba(244,86,107,.12); --acc-bg:rgba(79,140,255,.12);
  --r:18px; --r-sm:11px; --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 50px -24px rgba(0,0,0,.85);
  --font:"Inter",system-ui,"Segoe UI",Roboto,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.55 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";
  background-image:radial-gradient(1100px 600px at 100% -15%,rgba(79,140,255,.12),transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(139,92,246,.10),transparent 60%),radial-gradient(600px 400px at 50% 120%,rgba(45,212,191,.05),transparent 60%);background-attachment:fixed}
h1,h2,h3,h4,p{margin:0}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
::selection{background:rgba(79,140,255,.35)}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:#1f2a3f;border-radius:99px;border:2px solid var(--bg)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mute{color:var(--mute)} .faint{color:var(--faint)} .small{font-size:13px} .tiny{font-size:12px} .xs{font-size:11px}
.up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .acc{color:var(--accent)}
.right{text-align:right} .center{text-align:center} .nowrap{white-space:nowrap} .wrap{white-space:normal!important}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* ============================================================ layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(12,17,28,.92),rgba(8,12,20,.92));backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:4px;z-index:5}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 20px}
.logo{width:38px;height:38px;border-radius:12px;background:conic-gradient(from 210deg,var(--teal),var(--accent),var(--accent2),var(--teal));display:grid;place-items:center;box-shadow:0 8px 26px -8px rgba(79,140,255,.8),inset 0 0 0 1px rgba(255,255,255,.18)}
.logo svg{width:20px;height:20px}
.brand b{font-size:17px;letter-spacing:-.02em;font-weight:750} .brand span{display:block;font-size:10.5px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
.navt{font-size:10.5px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:12px 12px 6px}
.nav{position:relative;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer;color:var(--mute);text-align:left;width:100%;transition:.18s var(--ease);font-weight:550}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{color:var(--text);background:rgba(255,255,255,.035)}
.nav.on{color:var(--text);background:linear-gradient(135deg,rgba(79,140,255,.16),rgba(139,92,246,.08));border-color:rgba(79,140,255,.3)}
.nav.on:before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(var(--accent),var(--accent2))}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--down);color:#fff;border-radius:99px;padding:1px 7px;animation:pulse 1.2s infinite}
.nav .pill{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--teal);border:1px solid rgba(45,212,191,.35);border-radius:99px;padding:0 6px}
.side .foot{margin-top:auto;padding:12px 10px;font-size:11.5px;color:var(--faint);line-height:1.55;border-top:1px solid var(--line)}
.wrapmain{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:14px;padding:10px 30px;border-bottom:1px solid var(--line);background:rgba(6,9,15,.78);backdrop-filter:blur(14px)}
.ticker{display:flex;gap:22px;overflow:hidden;flex:1;min-width:0;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.ticker .tk{display:flex;align-items:baseline;gap:7px;white-space:nowrap;font-size:12.5px}
.ticker .tk b{font-weight:650;color:var(--text)} .ticker .tk .num{color:var(--mute)}
.topbar .clock{font-family:var(--mono);font-size:12px;color:var(--mute);white-space:nowrap}
.main{padding:26px 30px 90px;max-width:1280px;width:100%;margin:0 auto;min-width:0}
.vista:not([hidden]){animation:fade .35s var(--ease)}
.card,.stack,.grid>*{min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:27px;letter-spacing:-.03em;font-weight:750}
.top p{color:var(--mute);margin-top:4px;max-width:720px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--mute);background:rgba(255,255,255,.02);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chip.ok{color:var(--up);border-color:rgba(34,197,139,.4)} .chip.ok i{background:var(--up);box-shadow:0 0 0 3px rgba(34,197,139,.18);animation:pulse 2.4s infinite}
.chip.bad{color:var(--down);border-color:rgba(244,86,107,.45)} .chip.bad i{background:var(--down)}
.chip.info{color:var(--accent);border-color:rgba(79,140,255,.4)} .chip.info i{background:var(--accent)}
.chip.warn{color:var(--warn);border-color:rgba(245,181,68,.4)} .chip.warn i{background:var(--warn)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)} .split2{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1} .top0{align-items:flex-start}
.stack{display:flex;flex-direction:column;gap:14px}
section{margin-top:26px}
section>h2,.h2{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.11em;font-weight:650;margin-bottom:12px}
section>h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

/* ============================================================ componentes */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.034),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.card h3{font-size:15px;letter-spacing:-.01em;font-weight:650}
.card.tight{padding:12px 14px}
.card .sub{color:var(--mute);font-size:13px;margin-top:2px}
.glow:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(79,140,255,.6),rgba(139,92,246,.18) 40%,transparent 65%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi>span:first-child{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:7px}
.kpi b{display:block;font:700 25px/1.2 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:3px 0 1px}
.kpi>span:last-child{font-size:12px;color:var(--faint)}
.kpi .dot{width:8px;height:8px;border-radius:3px;background:var(--accent)}
.hero{padding:24px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(79,140,255,.6),rgba(139,92,246,.2) 45%,transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.hero .big{font:750 40px/1.1 var(--font);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.mod{display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.22s var(--ease)}
.mod:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 24px 60px -30px rgba(79,140,255,.45)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--acc-bg);color:var(--accent);flex:none}
.ico svg{width:21px;height:21px}
.ico.t{background:rgba(45,212,191,.12);color:var(--teal)} .ico.v{background:rgba(139,92,246,.14);color:#a78bfa} .ico.a{background:rgba(245,181,68,.12);color:var(--warn)}
.mod .spark{height:46px;margin:2px -4px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:11px;border:1px solid var(--line2);background:var(--surface2);cursor:pointer;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);background:#1a2540}
.btn.pri{background:linear-gradient(135deg,var(--accent),#6d63ff);border-color:transparent;color:#fff;box-shadow:0 10px 26px -12px var(--accent)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.buy{background:var(--up);border-color:transparent;color:#03150e;font-weight:700} .btn.sell{background:var(--down);border-color:transparent;color:#fff;font-weight:700}
.btn.ghost{background:none} .btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.field input,.field select{background:#080d16;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;color:var(--text);min-width:0;width:130px;font-family:var(--mono)}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.18)}
.seg,.tabs{display:inline-flex;background:#080d16;border:1px solid var(--line2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button,.tabs button{border:0;background:none;padding:7px 13px;border-radius:9px;color:var(--mute);cursor:pointer;font-weight:600;transition:.15s}
.seg button:hover,.tabs button:hover{color:var(--text)}
.seg button.on,.tabs button.on{background:var(--surface3);color:var(--text);box-shadow:0 0 0 1px var(--line2),0 4px 14px -6px rgba(0,0,0,.6)}
.tabs{margin-bottom:18px} .tabs button{display:inline-flex;align-items:center;gap:7px} .tabs button svg{width:16px;height:16px;flex:none}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:650;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:10px 10px;border-bottom:1px solid rgba(29,38,56,.7);white-space:nowrap;vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr{transition:background .12s} .table tbody tr:hover td{background:rgba(255,255,255,.022)}
.table tr.click{cursor:pointer} .table tr.sel td{background:rgba(79,140,255,.09)}
.table td.num,.table th.num{text-align:right}
.scroll{overflow-x:auto}
.coin{display:inline-flex;align-items:center;gap:8px;font-weight:650}
.coin i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:#fff;flex:none}
.tag{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:99px;border:1px solid;white-space:nowrap}
.tag.up{background:var(--up-bg);border-color:rgba(34,197,139,.35)} .tag.down{background:var(--down-bg);border-color:rgba(244,86,107,.4)}
.tag.wait{color:var(--mute);border-color:var(--line2)} .tag.warn{color:var(--warn);background:rgba(245,181,68,.1);border-color:rgba(245,181,68,.4)} .tag.info{color:var(--accent);background:var(--acc-bg);border-color:rgba(79,140,255,.4)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden} .bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s var(--ease)}
.bar.up i{background:var(--up)} .bar.down i{background:var(--down)}
.riesgo{display:inline-flex;gap:3px;vertical-align:middle} .riesgo i{width:14px;height:6px;border-radius:2px;background:rgba(255,255,255,.09)}
.riesgo i.on{background:var(--up)} .riesgo.r3 i.on{background:var(--warn)} .riesgo.r4 i.on,.riesgo.r5 i.on{background:var(--down)}
.note{border-left:3px solid var(--warn);background:rgba(245,181,68,.07);border-radius:0 11px 11px 0;padding:11px 14px;font-size:13.5px}
.note.good{border-color:var(--up);background:rgba(34,197,139,.07)} .note.bad{border-color:var(--down);background:rgba(244,86,107,.08)} .note.info{border-color:var(--accent);background:rgba(79,140,255,.07)}
.chart{height:340px;border-radius:12px;overflow:hidden} .chart.md{height:260px} .chart.sm{height:190px}
.empty{color:var(--mute);text-align:center;padding:28px 10px;font-size:14px}
.feed{display:flex;flex-direction:column}
.feed .it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(29,38,56,.7);font-size:13.5px}
.feed .it:last-child{border-bottom:0}
.feed .it .b{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--accent)} .feed .it .b.error{background:var(--down)} .feed .it .b.aviso{background:var(--warn)} .feed .it .b.bot{background:var(--teal)}
.feed .it .t{color:var(--faint);font-size:11.5px;font-family:var(--mono);white-space:nowrap}
.feed .it .x{white-space:pre-line;min-width:0;overflow-wrap:anywhere}
.steps{counter-reset:p;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:p;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:13.5px}
.steps li:before{content:counter(p);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acc-bg);color:var(--accent);font-weight:700;font-size:13px}
.opc{display:flex;flex-direction:column;gap:10px}
.opc .apy{font:750 30px/1 var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.opc dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0;font-size:12.5px} .opc dt{color:var(--faint)} .opc dd{margin:0}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1.4s infinite;border-radius:8px;color:transparent!important}
.signal{border-radius:var(--r);padding:18px 20px;border:1.5px solid;position:relative;overflow:hidden;animation:pop .35s ease-out}
.signal.up{border-color:var(--up);background:linear-gradient(135deg,rgba(34,197,139,.20),rgba(34,197,139,.05))}
.signal.down{border-color:var(--down);background:linear-gradient(135deg,rgba(244,86,107,.22),rgba(244,86,107,.05))}
.signal .big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0 8px}
.signal.up .big{color:var(--up)} .signal.down .big{color:var(--down)}
.signal .what{font-size:18px;font-weight:650}
.banner{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:50;max-width:min(620px,calc(100vw - 24px));width:100%;cursor:pointer}
.toast{position:fixed;right:18px;bottom:18px;background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:11px 15px;box-shadow:var(--shadow);z-index:60;animation:pop .25s}
details.more{border-top:1px solid var(--line);margin-top:12px;padding-top:10px} details.more summary{cursor:pointer;color:var(--mute);font-size:13.5px}
details.more[open] summary{margin-bottom:8px}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute)} .legend span{display:inline-flex;align-items:center;gap:6px} .legend i{width:12px;height:3px;border-radius:2px}
.disclaimer{font-size:11.5px;color:var(--faint);margin-top:34px;padding-top:14px;border-top:1px solid var(--line);line-height:1.6}
button.chip{cursor:pointer;font:inherit;font-size:12px} button.chip:hover{border-color:var(--accent);color:var(--text)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(3,6,12,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .2s}
.dlg{width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface)}
.qr{width:190px;height:190px;background:#fff;border-radius:12px;padding:6px;flex:none} .qr svg{width:100%;height:100%;display:block}
@keyframes pulse{50%{opacity:.5}} @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}} @keyframes sk{to{background-position:-200% 0}}
.banner.signal{animation:pop .35s ease-out}

/* ============================================================ movil */
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)} .wrapmain{width:100vw;overflow-x:hidden}
  .side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);justify-content:space-around;gap:2px}
  .brand,.side .foot,.navt{display:none}
  .nav{flex:1 1 0;min-width:0;flex-direction:column;gap:3px;font-size:10px;padding:7px 1px;justify-content:center;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav.on:before{display:none} .nav .pill{display:none}
  .nav .badge{position:absolute;top:2px;right:8px;margin:0}
  .topbar{padding:8px 14px} .topbar .clock{display:none} #nube .chip{max-width:44vw;overflow:hidden;text-overflow:ellipsis;display:block}
  .main{padding:18px 14px 110px}
  .g2,.g3,.split,.split2{grid-template-columns:minmax(0,1fr)}
  .field input,.field select{width:100%} .field{flex:1;min-width:110px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .kpi b{font-size:21px} .hero .big{font-size:32px}
  .signal .big{font-size:25px} .chart{height:280px}
  .top h1{font-size:23px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo" id="logo"></div><div><b>TerraInvest</b><span>Inversiones alternativas</span></div></div>
    <nav id="nav" style="display:contents"></nav>
    <div class="foot">Cuentas de práctica: ningún módulo mueve dinero real.<br>Datos: Binance, DefiLlama.<br>Gráficos: TradingView Lightweight Charts.<br><span id="version"></span></div>
  </aside>
  <div class="wrapmain">

  get(k, def) { try { const v = localStorage.getItem(this.pre + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v, silencioso) {
    if (!silencioso && v && typeof v === "object" && (k === "senales" || k === "futuros")) v.mod = Date.now();   // para unir PC y celular

App.fmt = {
  precio(x) { if (x == null || !isFinite(x)) return "—"; const a = Math.abs(x), d = a >= 100 ? 2 : a >= 1 ? 3 : a >= 0.01 ? 4 : 6; return x.toLocaleString("es-CO", { minimumFractionDigits: d, maximumFractionDigits: d }); },
  dinero(x, signo) { if (x == null || !isFinite(x)) return "—"; const s = x < 0 ? "−" : (signo && x > 0 ? "+" : ""); return s + "$" + Math.abs(x).toLocaleString("es-CO", Number.isInteger(x) ? {} : { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
  pct(x, d = 1, signo = true) { if (x == null || !isFinite(x)) return "—"; return (signo && x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(100 * x).toFixed(d).replace(".", ",") + " %"; },
  hora(t) { return new Date(t).toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit", hour12: false }); },
  fecha(t) { return new Date(t).toLocaleDateString("es-CO", { day: "2-digit", month: "2-digit" }); },
  fechaHora(t) { return t ? this.fecha(t) + " " + this.hora(t) : "—"; },
  dia(t) { return new Date(t).toLocaleDateString("es-CO", { day: "numeric", month: "short" }); },
  hace(t) { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "ahora" : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} d`; },
  usdt(x, signo) { if (x == null || !isFinite(x)) return "—"; const s = x < 0 ? "−" : (signo && x > 0 ? "+" : ""); return s + Math.abs(x).toLocaleString("es-CO", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " USDT"; },
  falta(ms) { ms = Math.max(0, ms); const m = Math.floor(ms / 60000); return m >= 60 ? Math.floor(m / 60) + " h " + (m % 60) + " min" : this.mmss(ms); },
  mmss(ms) { ms = Math.max(0, ms); const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); },
};

  beep() {
    if (!this.ctx) return;
    for (let j = 0; j < 3; j++) {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain(), t = this.ctx.currentTime + j * 0.25;
      o.frequency.value = 880; o.connect(g); g.connect(this.ctx.destination);
      g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2); o.start(t); o.stop(t + 0.2);
    }
  },
};

/* Datos publicos de Binance (spot y futuros). No usa claves: solo lee precios. */
App.api = {
  offset: 0, ok: false, ultimo: 0, cache: new Map(),
  ahora() { return Date.now() + this.offset; },
  async get(base, ruta, params, ttl = 0) {
    const url = base + ruta + (params ? "?" + new URLSearchParams(params) : "");
    const c = this.cache.get(url);
    if (c && Date.now() - c.t < ttl) return c.v;
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error("Binance " + r.status);
      const v = await r.json();
      this.cache.set(url, { t: Date.now(), v });
      if (this.cache.size > 400) this.cache.delete(this.cache.keys().next().value);
      this.ok = true; this.ultimo = Date.now();
      return v;
    } catch (e) { this.ok = Date.now() - this.ultimo < 30000; throw e; }
  },
  spot(ruta, params, ttl) { return this.get("https://api.binance.com", ruta, params, ttl); },
  fut(ruta, params, ttl) { return this.get("https://fapi.binance.com", ruta, params, ttl); },
  velas(simbolo, intervalo, limite = 300, ttl = 3000, extra) { return this.spot("/api/v3/klines", { symbol: simbolo, interval: intervalo, limit: limite, ...(extra || {}) }, ttl); },
  velasFut(simbolo, intervalo, limite = 300, ttl = 3000) { return this.fut("/fapi/v1/klines", { symbol: simbolo, interval: intervalo, limit: limite }, ttl); },
  cerradas(k) { const t = this.ahora(); return k.filter(x => +x[6] < t); },
  async sincronizar() { try { const j = await this.spot("/api/v3/time"); this.offset = j.serverTime - Date.now(); } catch (e) { /* se usa el reloj del equipo */ } },
  async enLotes(items, n, fn) {   // varias consultas a la vez sin saturar
    const out = new Array(items.length); let i = 0;
    await Promise.all(Array.from({ length: n }, async () => { while (i < items.length) { const j = i++; try { out[j] = await fn(items[j]); } catch (e) { out[j] = null; } } }));
    return out;
  },
};

/* Estado real de los bots: el servidor lo publica cada 15 minutos en la rama «estado» del repositorio (estado.json).

  d: DATOS.estado || null, ok: false, error: null, cargando: false,
  async cargar() {
    if (this.cargando) return; this.cargando = true;
    try {
      const r = await fetch(this.url + "?v=" + Math.floor(Date.now() / 120000), { cache: "no-store" });
      if (!r.ok) throw new Error("estado " + r.status);
      const d = await r.json();
      if (!this.d || (d.actualizado || 0) >= (this.d.actualizado || 0)) this.d = d;
      this.ok = true; this.error = null;
    } catch (e) { this.error = e.message; }
    this.cargando = false;
  },
  get fut() { return this.d && this.d.futuros && !this.d.futuros.error ? this.d.futuros : null; },
  get bot() { return this.d && this.d.bot && !this.d.bot.error ? this.d.bot : null; },
  get rend() { return (this.d && this.d.rendimientos) || DATOS.rendimientos || null; },
  edad() { return this.d ? Date.now() - this.d.actualizado : Infinity; },
  chip() {   // indicador de frescura de los datos del servidor
    if (!this.d) return '<span class="chip"><i></i>Sin datos del servidor</span>';

    return `<span class="chip ${viejo ? "bad" : "ok"}" title="El servidor publica cada 15 minutos"><i></i>${viejo ? "Servidor sin reportar hace " + App.fmt.falta(this.edad()) : "Servidor al día · hace " + Math.max(min, 0) + " min"}</span>`;

};

// ===== 17_nube.js
/* Guardado en la nube: los datos de la persona (marcador de señales, simulador) se guardan en una nota PRIVADA (gist secreto)
   de su propia cuenta de GitHub, asi se ven iguales en el PC y en el celular y no se pierden si el navegador se borra.
   La llave (token de GitHub, solo con permiso de «Gists») queda en cada dispositivo; nunca se publica ni sale de ahi. */
App.nube = {
  API: "https://api.github.com", ARCHIVO: "terrainvest.json", DESC: "TerraInvest · datos (privado)",
  CLAVES: ["senales", "futuros"],
  estado: "apagada", error: null, ultimo: 0, subiendo: null, firmaSubida: "",
  get token() { return App.store.get("nube_token", ""); },
  get gist() { return App.store.get("nube_gist", ""); },

  async pedir(metodo, ruta, cuerpo) {
    const r = await fetch(this.API + ruta, { method: metodo, cache: "no-store",
      headers: { Authorization: "Bearer " + this.token, Accept: "application/vnd.github+json", ...(cuerpo ? { "Content-Type": "application/json" } : {}) },
      body: cuerpo ? JSON.stringify(cuerpo) : undefined });
    if (r.ok) return r.json();
    let msg = ""; try { msg = (await r.json()).message || ""; } catch (e) { /* sin detalle */ }
    const err = new Error(r.status === 401 ? "La llave de GitHub no sirve o venció (revisa que la copiaste completa)"
      : (r.status === 403 || r.status === 404) ? `GitHub no dio permiso (${r.status}${msg ? ": " + msg : ""}). La llave necesita la casilla «gist».`
      : `GitHub respondió ${r.status}${msg ? ": " + msg : ""}`);
    err.status = r.status; throw err;
  },

  local() { const d = {}; this.CLAVES.forEach(k => { d[k] = App.store.get(k, null); }); return d; },

  /* Une lo de este dispositivo con lo de la nube sin perder nada:
     - señales: union por id; si las dos tienen la misma, gana la que tiene mas informacion anotada
     - saldo, ajustes y simulador: gana el mas reciente */
  unir(a, b) {
    if (!a) return b; if (!b) return a;
    const out = {};
    const senA = a.senales, senB = b.senales;
    if (senA || senB) {
      const hecho = s => s.modU || 0;   // el saldo y los ajustes los decide el ultimo cambio hecho a mano
      const base = !senA ? senB : !senB ? senA : (hecho(senA) !== hecho(senB) ? (hecho(senA) > hecho(senB) ? senA : senB) : ((senA.mod || 0) >= (senB.mod || 0) ? senA : senB));
      const borrado = Math.max((senA && senA.borrado) || 0, (senB && senB.borrado) || 0);
      const peso = s => (s.plataforma ? 8 : 0) + (s.estado === "entro" ? 4 : 0) + (s.estado === "paso" ? 2 : 0) + (s.binance ? 1 : 0);
      const todas = new Map();
      [...((senA && senA.senales) || []), ...((senB && senB.senales) || [])].forEach(s => { const y = todas.get(s.id); if (!y || peso(s) > peso(y)) todas.set(s.id, s); });
      out.senales = { ...base, borrado, senales: [...todas.values()].filter(s => s.t0 > borrado).sort((x, y) => x.t0 - y.t0).slice(-5000) };
    }
    const fa = a.futuros, fb = b.futuros;
    out.futuros = !fa ? fb : !fb ? fa : ((fa.mod || 0) >= (fb.mod || 0) ? fa : fb);
    return out;
  },

  aplicar(d) {   // pone los datos unidos en la pagina y en este dispositivo

  async buscarGist() {
    if (this.gist) return this.gist;

    let g = lista.find(x => x.description === this.DESC && x.files && x.files[this.ARCHIVO]);

// ===== 20_modelos.js
/* Modelos: calculo puro (sin pantalla ni red). Deben dar EXACTAMENTE lo mismo que el codigo Python del bot y del estudio;
   plataforma/probar.py lo comprueba con un motor de JavaScript. No cambiar sin volver a correr esa prueba. */
/*MODELO-INICIO*/
function std(a){const n=a.length;let m=0;for(const x of a)m+=x;m/=n;let s=0;for(const x of a)s+=(x-m)*(x-m);return Math.sqrt(s/(n-1));}
function mean(a){let m=0;for(const x of a)m+=x;return m/a.length;}

/* ---- Señales a minutos (scripts/investigacion/binarias.py). k: velas cerradas [aperturaMs, apertura, max, min, cierre, volumen] */
function variables(k){
  const n=k.length,i=n-1; if(n<125) return null;
  const c=k.map(x=>+x[4]),h=k.map(x=>+x[2]),lo=k.map(x=>+x[3]),o=k.map(x=>+x[1]),v=k.map(x=>+x[5]);
  const r=[NaN]; for(let j=1;j<n;j++) r.push(Math.log(c[j]/c[j-1]));
  const f={};
  for(const m of [1,2,3,5,10,20,60]) f["ret"+m]=Math.log(c[i]/c[i-m]);
  const vol=std(r.slice(i-59,i+1));
  for(const m of [1,5,20]) f["z"+m]=f["ret"+m]/(vol*Math.sqrt(m));
  f.vol_ratio=std(r.slice(i-9,i+1))/vol;
  const w=r.slice(i-13,i+1),up=mean(w.map(x=>Math.max(x,0))),dn=mean(w.map(x=>Math.max(-x,0)));
  f.rsi=up/(up+dn);
  for(const m of [20,60]){const hi=Math.max(...h.slice(i-m+1,i+1)),lw=Math.min(...lo.slice(i-m+1,i+1));f["pos"+m]=(c[i]-lw)/(hi-lw);}
  const rng=h[i]-lo[i];
  f.body=(c[i]-o[i])/rng; f.wick_up=(h[i]-Math.max(c[i],o[i]))/rng; f.wick_dn=(Math.min(c[i],o[i])-lo[i])/rng;
  const vw=v.slice(i-59,i+1); f.vol_z=(v[i]-mean(vw))/std(vw);
  const s=Math.sign(r[i]); let run=0; for(let j=i-1;j>=1&&Math.sign(r[j])===s;j--) run++;
  f.racha=run*s;
  const d=new Date(+k[i][0]),hour=d.getUTCHours()+d.getUTCMinutes()/60;
  f.h_sin=Math.sin(2*Math.PI*hour/24); f.h_cos=Math.cos(2*Math.PI*hour/24);
  for(const key in f) if(!isFinite(f[key])) return null;
  return f;
}
function probabilidad(a,k){ // probabilidad de que SUBA en el horizonte del modelo
  const f=variables(k); if(!f) return null;
  let z=a.intercepto; a.cols.forEach((col,j)=>{z+=a.coef[j]*(f[col]-a.media[j])/a.escala[j];});
  return 1/(1+Math.exp(-z));
}

/* ---- Tendencia por canales (bot/trend.py). k: velas cerradas de 4 h. bpd = velas por dia. */
function canal(k,diasIn,diasOut,bpd){
  const n=k.length,wi=diasIn*bpd,wo=diasOut*bpd,h=k.map(x=>+x[2]),lo=k.map(x=>+x[3]),c=k.map(x=>+x[4]);
  if(n<=wi) return null;
  let estado=0,hi=NaN,lw=NaN;
  for(let i=wo;i<n;i++){
    lw=Infinity; for(let j=i-wo;j<i;j++) if(lo[j]<lw) lw=lo[j];
    hi=NaN; if(i>=wi){hi=-Infinity; for(let j=i-wi;j<i;j++) if(h[j]>hi) hi=h[j];}
    if(c[i]>hi) estado=1; else if(c[i]<lw) estado=-1;
  }
  return {largo:estado===1,corto:null,hi,lo:lw,cierre:c[n-1]};
}
function canalCorto(k,diasIn,diasOut,bpd){ // espejo para futuros: entra al perder el minimo de diasIn, sale al superar el maximo de diasOut
  const n=k.length,wi=diasIn*bpd,wo=diasOut*bpd,h=k.map(x=>+x[2]),lo=k.map(x=>+x[3]),c=k.map(x=>+x[4]);
  if(n<=wi) return null;
  let estado=0,hi=NaN,lw=NaN;
  for(let i=wo;i<n;i++){
    hi=-Infinity; for(let j=i-wo;j<i;j++) if(h[j]>hi) hi=h[j];
    lw=NaN; if(i>=wi){lw=Infinity; for(let j=i-wi;j<i;j++) if(lo[j]<lw) lw=lo[j];}
    if(c[i]<lw) estado=1; else if(c[i]>hi) estado=-1;
  }
  return {corto:estado===1,hi,lo:lw,cierre:c[n-1]};
}
function filtroBtc(k,dias,bpd){ // Bitcoin sobre su media de `dias` dias
  const w=dias*bpd,c=k.map(x=>+x[4]); if(c.length<w) return null;
  const m=mean(c.slice(c.length-w)); return {sano:c[c.length-1]>m,dist:c[c.length-1]/m-1,media:m};
}
function atrDiario(k,bpd){ // ATR(14) de Wilder en velas de 4 h, llevado a un dia (como bot/signals.py)
  const n=k.length; if(n<16) return null;
  let a=null,s=0;
  for(let i=1;i<n;i++){
    const tr=Math.max(+k[i][2]-+k[i][3],Math.abs(+k[i][2]-+k[i-1][4]),Math.abs(+k[i][3]-+k[i-1][4]));
    if(i<=14){s+=tr; if(i===14) a=s/14;} else a=(a*13+tr)/14;
  }
  return a*Math.sqrt(bpd);
}
function elegirUniverso(vol,inicioMes,n,ventana,minHist){ // vol: {simbolo: [[ms, volumenUSDT]...]} diario
  const r=[];
  for(const s in vol){
    const past=vol[s].filter(x=>x[0]<inicioMes);
    if(past.length<minHist||past[past.length-1][0]<inicioMes-3*86400000) continue;
    r.push([mean(past.slice(-ventana).map(x=>x[1])),s]);
  }
  return r.sort((a,b)=>b[0]-a[0]).slice(0,n).map(x=>x[1]);
}
/*MODELO-FIN*/
App.modelo = { variables, probabilidad, canal, canalCorto, filtroBtc, atrDiario, elegirUniverso };

App.grafico = el => {

  const css = getComputedStyle(document.documentElement), v = n => css.getPropertyValue(n).trim();
  const chart = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: { background: { color: "transparent" }, textColor: v("--mute"), fontFamily: v("--font"), fontSize: 12 },
    grid: { vertLines: { color: "rgba(255,255,255,.035)" }, horzLines: { color: "rgba(255,255,255,.035)" } },
    rightPriceScale: { borderColor: v("--line") }, timeScale: { borderColor: v("--line"), timeVisible: true, secondsVisible: false },
    crosshair: { mode: 0 }, localization: { locale: "es-CO" },
  });
  const velas = chart.addCandlestickSeries({ upColor: v("--up"), downColor: v("--down"), wickUpColor: v("--up"), wickDownColor: v("--down"), borderVisible: false });
  let lineas = [], clave = "";
  const local = ms => Math.floor(ms / 1000) - new Date().getTimezoneOffset() * 60;   // el grafico muestra hora local
  return {
    velas(k, id) {
      velas.setData(k.map(x => ({ time: local(+x[0]), open: +x[1], high: +x[2], low: +x[3], close: +x[4] })));
      if (id !== clave) { clave = id; chart.timeScale().fitContent(); }
    },
    niveles(lista) {   // [{precio, titulo, color}]
      lineas.forEach(l => velas.removePriceLine(l));
      lineas = lista.filter(l => isFinite(l.precio)).map(l => velas.createPriceLine({ price: l.precio, color: l.color, lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: l.titulo }));
    },
    marcas(lista) {    // [{t (ms), sube (bool), texto}]
      velas.setMarkers(lista.sort((a, b) => a.t - b.t).map(m => ({ time: local(m.t), position: m.sube ? "belowBar" : "aboveBar", shape: m.sube ? "arrowUp" : "arrowDown", color: m.sube ? v("--up") : v("--down"), text: m.texto || "" })));
    },
  };
};

    if (!this.montado) return;

/* Modulo Trading: radar del motor de tendencia del bot. Calcula con datos publicos lo mismo que el bot calcula en el servidor.
   No ve la cuenta ni las posiciones reales (eso vive en Telegram): muestra que monedas estan en tendencia y a que precio entraria o saldria. */
App.trading = {
  cfg: DATOS.tendencia, universo: [], filas: [], btc: null, listo: false, error: null, sel: null, cargando: false,

  excluida(base) { return this.cfg.excluidas.includes(base) || (base.length > 4 && /(UP|DOWN|BULL|BEAR)$/.test(base)); },

  async cargarUniverso() {   // las 10 mas negociadas del mes, igual que bot/exchange.py
    const hoy = new Date(App.api.ahora()), inicio = Date.UTC(hoy.getUTCFullYear(), hoy.getUTCMonth(), 1), mes = new Date(inicio).toISOString().slice(0, 7);
    const guardado = App.store.get("universo");
    if (guardado && guardado.mes === mes && guardado.simbolos.length) return guardado.simbolos;
    const dia = await App.api.spot("/api/v3/ticker/24hr", null, 600000);
    const cands = dia.filter(t => t.symbol.endsWith("USDT") && !this.excluida(t.symbol.slice(0, -4)) && +t.quoteVolume > 0)
      .sort((a, b) => b.quoteVolume - a.quoteVolume).slice(0, 80).map(t => t.symbol);
    const series = await App.api.enLotes(cands, 8, s => App.api.velas(s, "1d", 250, 3600000));
    const vol = {};
    cands.forEach((s, i) => { if (series[i]) vol[s] = series[i].map(x => [+x[0], +x[7]]); });
    const pick = App.modelo.elegirUniverso(vol, inicio, this.cfg.top, this.cfg.ventana, this.cfg.min_historia);
    if (pick.length) App.store.set("universo", { mes, simbolos: pick });
    return pick;
  },

  async actualizar() {
    if (this.cargando) return;
    this.cargando = true;
    try {
      if (!this.universo.length) this.universo = await this.cargarUniverso();
      const c = this.cfg, bpd = 6, syms = [...new Set(["BTCUSDT", ...this.universo])];
      const todas = await App.api.enLotes(syms, 6, s => App.api.velas(s, "4h", 1000, 55000));
      const vel = {}; syms.forEach((s, i) => { if (todas[i]) vel[s] = todas[i]; });
      if (!vel.BTCUSDT) throw new Error("sin datos de Bitcoin");
      this.btc = App.modelo.filtroBtc(App.api.cerradas(vel.BTCUSDT), c.gate_dias, bpd);
      this.filas = this.universo.filter(s => vel[s]).map(s => {
        const k = App.api.cerradas(vel[s]), ch = App.modelo.canal(k, c.canal_in, c.canal_out, bpd), atr = App.modelo.atrDiario(k, bpd);
        const precio = +vel[s][vel[s].length - 1][4];
        const enTendencia = !!(ch && ch.largo && this.btc && this.btc.sano);
        return { sym: s, base: s.slice(0, -4), precio, velas: vel[s], hi: ch ? ch.hi : NaN, lo: ch ? ch.lo : NaN, canalLargo: !!(ch && ch.largo), enTendencia,
                 stop: atr ? precio - c.stop_atr * atr : NaN, atr };
      });
      if (!this.sel || !this.filas.some(f => f.sym === this.sel)) this.sel = (this.filas.find(f => f.enTendencia) || this.filas[0] || {}).sym;
      this.listo = true; this.error = null;
    } catch (e) { this.error = e.message; }
    this.cargando = false;
    if (App.activo && (App.activo.id === "trading" || App.activo.id === "inicio")) App.activo.pintar && App.activo.pintar();
  },

  resumen() {
    if (!this.listo) return { texto: this.error ? "Sin conexión" : "Cargando…", detalle: "" };
    const n = this.filas.filter(f => f.enTendencia).length;
    return { texto: this.btc.sano ? `${n} de ${this.filas.length} en tendencia` : "En efectivo", sano: this.btc.sano,
             detalle: `Bitcoin ${App.fmt.pct(this.btc.dist, 0)} frente a su media de ${this.cfg.gate_dias} días` };
  },
};

// ===== 42_senales.js
/* Modulo Señales: avisa si un activo va a subir o bajar hasta el proximo cuarto de hora (modelo de opciones de tiempo fijo).
   Solo avisa: la operacion la hace la persona, en la cuenta demo de la plataforma. Lleva el marcador de la prueba. */
App.senales = {
  M: DATOS.senales, VALIDA: 120000, mercado: {}, vistos: {}, pruebaOK: false, escrito: {},
  S: Object.assign({ saldo: 1000, pct: 1, pago: Math.round(100 * DATOS.senales.pago), senales: [] }, App.store.get("senales", {})),

  get H() { return this.M.horizonte_min * 60000; }, get BAR() { return this.M.vela_min * 60000; },
  guardar() { App.store.set("senales", this.S); },
  necesario(pago) { return 1 / (1 + (pago || this.S.pago) / 100); },
  monto() { return Math.max(1, Math.round(this.S.saldo * this.S.pct / 100)); },
  activas() { return this.S.senales.filter(s => s.estado === "nueva"); },

  autoprueba() {
    const t = this.M.autoprueba, p = App.modelo.probabilidad(this.M.activos[t.activo], t.velas);
    this.pruebaOK = p !== null && Math.abs(p - t.esperado) < 1e-6;
    return this.pruebaOK;
  },

  async tick() {
    const A = this.M.activos, nombres = Object.keys(A), ahora = App.api.ahora();
    const todas = await Promise.all(nombres.map(n => App.api.velas(A[n].simbolo, this.M.vela_min + "m", 300, 2500)));
    nombres.forEach((n, j) => {
      const k = todas[j], cerr = App.api.cerradas(k), ult = cerr[cerr.length - 1], a = A[n];
      const p = App.modelo.probabilidad(a, cerr);
      this.mercado[n] = { precio: +k[k.length - 1][4], velas: k, p };
      const id = n + "-" + ult[0], t0 = +ult[6] + 1;
      if (!this.pruebaOK || p === null || this.vistos[id]) return;
      this.vistos[id] = true;
      const enCuarto = new Date(t0).getUTCMinutes() % this.M.horizonte_min === 0;   // la plataforma cierra en :00 :15 :30 :45
      if (enCuarto && Math.abs(p - 0.5) >= a.umbral && ahora - t0 < this.VALIDA && !this.S.senales.some(s => s.id === id)) {
        this.S.senales.push({ id, activo: n, dir: p > 0.5 ? "SUBE" : "BAJA", t0, exp: t0 + this.H, ref: +ult[4], conf: Math.abs(p - 0.5), estado: "nueva",
                              sugerido: this.monto(), monto: null, binance: null, cierre: null, plataforma: null, pago: null, neto: null });
        if (this.S.senales.length > 5000) this.S.senales = this.S.senales.slice(-5000);
        this.guardar(); App.sonido.beep();
      }
    });
    await this.calificar();
    this.S.senales.forEach(s => { if (s.estado === "nueva" && App.api.ahora() - s.t0 > this.VALIDA) { s.estado = "paso"; this.guardar(); } });
  },

  async calificar() {   // cada señal se califica con el precio real de Binance al vencer
    for (const s of this.S.senales) {
      if (s.binance || App.api.ahora() < s.exp + 4000) continue;
      const abre = s.exp - this.BAR - 1; let k = (this.mercado[s.activo] || {}).velas || [], vela = k.find(x => +x[0] === abre);
      if (!vela) { try { k = await App.api.velas(this.M.activos[s.activo].simbolo, this.M.vela_min + "m", 5, 0, { startTime: abre, endTime: abre + this.BAR }); vela = k.find(x => +x[0] === abre); } catch (e) { /* se reintenta */ } }
      if (!vela || +vela[6] >= App.api.ahora()) continue;
      s.cierre = +vela[4];
      const sube = s.cierre > s.ref, baja = s.cierre < s.ref;
      s.binance = (s.dir === "SUBE" ? sube : baja) ? "gano" : ((sube || baja) ? "perdio" : "empate");
      this.guardar();
    }
  },

  accion(id, que, val) {
    const s = this.S.senales.find(x => x.id === id); if (!s) return;
    if (que === "entro") { const inp = document.getElementById("m-" + id); s.monto = Math.max(0, +(inp && inp.value) || s.sugerido); s.estado = "entro"; s.tClic = App.api.ahora(); }
    if (que === "paso") s.estado = "paso";
    if (que === "res") {
      s.plataforma = val; s.pago = this.S.pago;
      s.neto = val === "gano" ? s.monto * this.S.pago / 100 : (val === "perdio" ? -s.monto : 0);
      this.S.saldo = Math.round((this.S.saldo + s.neto) * 100) / 100;
    }
    this.S.modU = Date.now();   // cambio hecho por la persona: manda al unir PC y celular
    this.guardar(); App.pintarTodo();
  },

  marcador() {
    const mias = this.S.senales.filter(s => s.plataforma), g = mias.filter(s => s.plataforma === "gano").length, p = mias.filter(s => s.plataforma === "perdio").length, n = g + p;
    const pagos = mias.filter(s => s.pago).map(s => s.pago), pagoMedio = pagos.length ? pagos.reduce((a, b) => a + b, 0) / pagos.length : this.S.pago;
    const sw = this.S.senales.filter(s => s.binance), swg = sw.filter(s => s.binance === "gano").length;
    const ambas = mias.filter(s => s.binance && s.binance !== "empate" && s.plataforma !== "empate"), igual = ambas.filter(s => s.binance === s.plataforma).length;
    const z = 1.96, ph = n ? g / n : 0, bajo = n ? (ph + z * z / (2 * n) - z * Math.sqrt(ph * (1 - ph) / n + z * z / (4 * n * n))) / (1 + z * z / n) : 0;
    return { total: mias.length, g, p, n, acierto: n ? g / n : null, bajo, necesario: this.necesario(pagoMedio), neto: mias.reduce((a, s) => a + (s.neto || 0), 0),
             sw: sw.length, swAcierto: sw.length ? swg / sw.length : null, ambas: ambas.length, coincide: ambas.length ? igual / ambas.length : null };
  },

  resumen() {
    const m = this.marcador(), act = this.activas().length;
    return { texto: act ? `${act} señal${act > 1 ? "es" : ""} activa${act > 1 ? "s" : ""}` : (m.n ? `Acierto ${App.fmt.pct(m.acierto, 1, false)}` : "Esperando señal"),
             detalle: m.n ? `${m.n} operaciones anotadas · necesitas ${App.fmt.pct(m.necesario, 1, false)}` : "Aún no has anotado operaciones", activa: act > 0 };
  },

  tarjeta(s) {
    const a = this.M.activos[s.activo], sube = s.dir === "SUBE";
    return `<div class="signal ${sube ? "up" : "down"}">
      <div class="small mute">${a.nombre} · precio de referencia ${App.fmt.precio(s.ref)}</div>
      <div class="big">${s.activo} VA A ${sube ? "SUBIR ▲" : "BAJAR ▼"}</div>
      <div class="what">En «Tiempo» elige <span class="num">${App.fmt.hora(s.exp)}</span> · entra con <span class="num">${App.fmt.dinero(s.sugerido)}</span></div>
      <div class="bar" style="margin:12px 0 10px"><i id="b-${s.id}" style="background:var(--warn)"></i></div>
      <div class="row between"><span class="small">Válida <b id="c-${s.id}" class="num"></b> más. Si no alcanzas, déjala pasar.</span>
        <span class="row"><label class="field">Monto que pusiste<input id="m-${s.id}" type="number" min="0" step="1" value="${s.sugerido}"></label>
        <button class="btn pri" data-a="entro" data-id="${s.id}">Entré</button><button class="btn" data-a="paso" data-id="${s.id}">La dejé pasar</button></span></div></div>`;
  },
};

/* Modulo Futuros: (1) el bot automatico de futuros, con su estado real publicado por el servidor; (2) simulador en papel
   para practicar a mano; (3) tasa de financiacion y estudio. La pagina no envia ordenes ni usa claves. */
App.futuros = {
  cfg: DATOS.futuros, COMISION: 0.0005, MANT: 0.005, mercado: {}, marcas: {}, velas: {}, radar: {}, sel: "BTCUSDT", lado: 1, listo: false, tab: App.store.get("futuros_tab", "bot"),
  S: Object.assign({ saldo: 1000, inicial: 1000, abiertas: [], cerradas: [] }, App.store.get("futuros", {})),
  guardar() { App.store.set("futuros", this.S); },

  liquidacion(entrada, lado, apal) { return entrada * (1 - lado * (1 / apal - this.MANT)); },   // aproximada, margen aislado
  pnl(p, precio) { return p.lado * p.cant * (precio - p.entrada); },

  async tick(completo) {
    const syms = this.cfg.simbolos;
    const idx = await App.api.fut("/fapi/v1/premiumIndex", null, 4000);
    idx.forEach(x => { this.marcas[x.symbol] = +x.markPrice; if (syms.includes(x.symbol)) this.mercado[x.symbol] = { precio: +x.markPrice, tasa: +x.lastFundingRate, prox: +x.nextFundingTime }; });
    this.listo = true;
    const ahora = App.api.ahora();
    for (const p of this.S.abiertas.slice()) {   // financiacion y liquidacion de las posiciones en papel
      const m = this.mercado[p.sym]; if (!m) continue;
      const dt = Math.min(ahora - (p.tFin || p.t), 3600000);
      p.fin = (p.fin || 0) + p.lado * p.cant * m.precio * m.tasa * dt / (8 * 3600000); p.tFin = ahora;   // el largo paga si la tasa es positiva
      if (p.lado * (m.precio - p.liq) <= 0) this.cerrar(p.id, p.liq, "liquidada");
    }
    if (this.S.abiertas.length) this.guardar();
    if (completo) await this.cargarRadar();
  },

  async cargarRadar() {
    const syms = this.cfg.simbolos, c = DATOS.tendencia, bpd = 6;
    const todas = await App.api.enLotes(syms, 4, s => App.api.velasFut(s, "4h", 1000, 55000));
    syms.forEach((s, i) => { if (todas[i]) this.velas[s] = todas[i]; });
    if (!this.velas.BTCUSDT) return;
    const btc = App.modelo.filtroBtc(App.api.cerradas(this.velas.BTCUSDT), c.gate_dias, bpd);
    syms.forEach(s => {
      if (!this.velas[s]) return;
      const k = App.api.cerradas(this.velas[s]), L = App.modelo.canal(k, c.canal_in, c.canal_out, bpd), C = App.modelo.canalCorto(k, c.canal_in, c.canal_out, bpd);
      this.radar[s] = { estado: L && L.largo && btc.sano ? 1 : (C && C.corto && !btc.sano ? -1 : 0), hi: L ? L.hi : NaN, lo: L ? L.lo : NaN, btc };
    });
  },

  abrir(sym, lado, margen, apal) {
    const m = this.mercado[sym];
    if (!m) return "Sin precio todavía.";
    if (!(margen > 0) || margen > this.S.saldo) return "El margen debe ser mayor que cero y no superar el saldo libre.";
    const nominal = margen * apal, minimo = this.cfg.minimos[sym] || 5;
    if (nominal < minimo) return `Binance exige operaciones de al menos ${minimo} USDT en ${sym.slice(0, -4)}. Con ese margen y apalancamiento llegas a ${nominal.toFixed(2)}.`;
    const com = nominal * this.COMISION, entrada = m.precio;
    this.S.saldo -= margen + com;
    this.S.abiertas.push({ id: "f" + Date.now(), sym, lado, apal, margen, entrada, cant: nominal / entrada, t: App.api.ahora(), liq: this.liquidacion(entrada, lado, apal), com, fin: 0 });
    this.guardar(); return null;
  },

  cerrar(id, precio, motivo) {
    const i = this.S.abiertas.findIndex(p => p.id === id); if (i < 0) return;
    const p = this.S.abiertas[i], px = precio || (this.mercado[p.sym] || {}).precio; if (!px) return;
    const com2 = p.cant * px * this.COMISION;
    let neto = this.pnl(p, px) - p.com - com2 - (p.fin || 0);
    if (motivo === "liquidada" || neto < -p.margen) neto = -p.margen;   // en margen aislado no se pierde mas que el margen
    this.S.saldo += p.margen + neto + p.com;   // la comision de apertura ya se habia descontado
    this.S.abiertas.splice(i, 1);
    this.S.cerradas.unshift({ ...p, salida: px, tSal: App.api.ahora(), neto, motivo: motivo || "manual" });
    this.S.cerradas = this.S.cerradas.slice(0, 500);
    this.guardar();
  },

  patrimonio() { return this.S.saldo + this.S.abiertas.reduce((a, p) => { const m = this.mercado[p.sym]; return a + p.margen + (m ? this.pnl(p, m.precio) - (p.fin || 0) : 0); }, 0); },
  resumen() {
    const eq = this.patrimonio(), n = this.S.cerradas.length;
    return { texto: this.S.abiertas.length ? `${this.S.abiertas.length} posición${this.S.abiertas.length > 1 ? "es" : ""} en papel` : (n ? `${App.fmt.dinero(eq - this.S.inicial, true)} en papel` : "Simulador listo"),
             detalle: this.listo && this.mercado.BTCUSDT ? `Financiación BTC ${App.fmt.pct(this.mercado.BTCUSDT.tasa * 3 * 365, 1)} anual` : "Dinero ficticio, precios reales" };
  },
};

/* Modulo Rendimientos: donde poner a ganar intereses el dinero quieto. Tasas reales (DefiLlama, Binance) publicadas por el
   servidor una vez al dia; la tasa neutral de BTC se recalcula en vivo con la financiacion de Binance. */
App.rendimientos = {
  filtro: "todos",
  opciones() {
    const r = App.estado.rend, ops = r && r.opciones ? r.opciones.map(o => ({ ...o })) : [];
    const b = App.futuros.mercado.BTCUSDT, carry = ops.find(o => o.id === "carry_btc");
    if (b && carry) { carry.vivo = b.tasa * 3 * 365 / 2; }
    return ops;
  },
  tasa(o) { return o.vivo != null ? o.vivo : o.apy; },
  mejor() {   // la mejor en dolares con riesgo bajo
    return this.opciones().filter(o => o.moneda === "USD" && o.riesgo <= 2 && isFinite(o.apy)).sort((a, b) => b.apy - a.apy)[0];
  },
  resumen() {
    const m = this.mejor();
    return m ? { texto: `Hasta ${App.fmt.pct(m.apy, 1, false)} al año`, detalle: `en dólares con riesgo bajo · ${m.nombre}` } : { texto: "Cargando tasas…", detalle: "" };
  },
};

      }).join(""));
      vis.forEach(o => { const s = el => el && o.serie && o.serie.length > 1 && App.spark(el, o.serie.map(([mes, v]) => ({ time: Date.UTC(+mes.slice(0, 4), +mes.slice(5, 7) - 1, 1) / 1000, value: 100 * v })), el.dataset.color); s($(`.spark[data-id="${o.id}"]`)); });

// ===== 99_arranque.js
/* Arranque: arma la navegacion, enciende los relojes y mantiene vivos los datos de cada modulo. */
App.pintarTodo = () => { try { if (App.activo && App.activo.pintar) App.activo.pintar(); App.bandera(); } catch (e) { console.error(e); } };

App.bandera = () => {   // aviso global: una señal activa se ve desde cualquier modulo
  const act = App.senales.activas(), nav = document.querySelector('.nav[data-id="senales"]');
  let b = nav.querySelector(".badge");
  if (act.length && !b) { b = document.createElement("span"); b.className = "badge"; nav.appendChild(b); }
  if (b) { if (act.length) b.textContent = act.length; else b.remove(); }
  const fuera = act.length && App.activo && App.activo.id !== "senales";
  App.html(document.getElementById("bandera"), fuera ? act.map(s => `<div class="signal banner ${s.dir === "SUBE" ? "up" : "down"}"><div class="row between"><b>${s.activo} VA A ${s.dir === "SUBE" ? "SUBIR ▲" : "BAJAR ▼"} · cierra ${App.fmt.hora(s.exp)}</b><span class="small">Ver señal →</span></div></div>`).join("") : "");
  document.title = act.length ? `▶ ${act[0].activo} ${act[0].dir} · Señal` : "TerraInvest";
};

(async () => {
  const ORDEN = ["inicio", "trading", "futuros", "rendimientos", "senales", "guia"];
  App.modulos.sort((a, b) => ORDEN.indexOf(a.id) - ORDEN.indexOf(b.id));
  const nav = document.getElementById("nav");
  let grupo = null;
  nav.innerHTML = App.modulos.map(m => {
    const cab = m.grupo && m.grupo !== grupo ? `<div class="navt">${m.grupo}</div>` : "";
    grupo = m.grupo || grupo;
    return cab + `<button class="nav" data-id="${m.id}">${App.ico[m.icono]}<span>${m.titulo}</span>${m.nuevo ? '<span class="pill">NUEVO</span>' : ""}</button>`;
  }).join("");
  nav.addEventListener("click", e => { const b = e.target.closest(".nav"); if (b) App.ir(b.dataset.id); });
  document.getElementById("bandera").addEventListener("click", () => App.ir("senales"));
  document.getElementById("vistas").innerHTML = App.modulos.map(m => `<div class="vista" data-id="${m.id}" hidden></div>`).join("");
  App.senales.autoprueba();
  document.addEventListener("click", e => { if (e.target.closest("[data-nube]")) App.nube.ventana(); });
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* el navegador decide */ }
  if (!App.nube.leerEnlace()) App.nube.bajar();
  App.nube.pintar();
  setInterval(() => { if (App.nube.token && document.visibilityState === "visible") App.nube.bajar(); }, 90000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && App.nube.token) App.nube.bajar(); else if (App.nube.token) App.nube.subir(); });
  window.addEventListener("hashchange", () => App.ir(location.hash.replace("#/", "")));
  App.ir(location.hash.replace("#/", "") || "inicio");
  App.ticker.reloj();
  await App.api.sincronizar();
  const seguro = fn => async () => { try { await fn(); } catch (e) { /* sin conexion: se reintenta en el siguiente ciclo */ } App.pintarTodo(); };
  const en = (...ids) => ids.includes(App.activo.id);
  const tSen = seguro(() => App.senales.tick()), tTra = seguro(() => App.trading.actualizar());
  const tFut = seguro(() => (en("futuros", "inicio", "rendimientos") || App.futuros.S.abiertas.length) ? App.futuros.tick(false) : null);
  const tRad = seguro(() => en("futuros") ? App.futuros.cargarRadar() : null);
  const tEst = seguro(() => App.estado.cargar()), tTick = seguro(() => App.ticker.tick());
  tEst().then(() => { const m = App.modulos.find(x => x.id === "inicio"); if (m.montado) m.cargarBtc(); });
  tTick(); tSen(); tTra(); tFut();
  setInterval(tSen, 4000); setInterval(tFut, 5000); setInterval(tTick, 10000); setInterval(tTra, 60000); setInterval(tRad, 60000); setInterval(tEst, 60000);
  setInterval(() => { App.ticker.reloj(); const m = App.modulos.find(x => x.id === "trading"); if (m.montado) m.reloj(); if (en("senales", "futuros")) App.pintarTodo(); else App.bandera(); }, 1000);
})();

document.getElementById("logo").innerHTML = App.ico.logo;
document.getElementById("version").textContent = "Versión " + DATOS.generado.replace("T", " ");
