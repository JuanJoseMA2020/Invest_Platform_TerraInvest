# Bot de futuros (cuenta Demo de Binance) y publicador de la plataforma. Separado del bot de trading: otra carpeta en el
# servidor (~/plataforma), otra base de datos, otros frenos y otro chat de Telegram.
#
# No existe opcion de dinero real: las ordenes solo van a la cuenta Demo (demo-fapi.binance.com).

futuros:
  capital: 1000            # capital asignado a la estrategia (USDT de la cuenta Demo). Los resultados se miden sobre esto.
  apalancamiento: 2        # por contrato, margen aislado. El tamaño lo fija el riesgo, no el apalancamiento.
  riesgo: 0.0075           # % del capital que se pierde si toca el stop (tope duro: 1 %)
  stop_atr: 3.0            # stop = entrada -/+ 3 veces el movimiento diario normal (ATR de 14 dias)
  peso_max: 0.15           # tope por posicion (valor del contrato / capital)
  exposicion_max: 1.0      # suma de todas las posiciones / capital
  max_posiciones: 10
  canal_entrada: 20        # largo: cierra sobre el maximo de 20 dias · corto: cierra bajo el minimo de 20 dias
  canal_salida: 10         # sale del largo bajo el minimo de 10 dias · sale del corto sobre el maximo de 10 dias
  filtro_dias: 100         # Bitcoin sobre su media de 100 dias: solo largos · debajo: solo cortos
  universo: 10             # las 10 monedas con mas volumen en futuros (ultimos 60 dias), elegidas el dia 1 de cada mes
  ventana_volumen: 60
  historia_min: 120
  freno_diario: 0.03       # pierde 3 % en el dia: no abre mas ese dia
  freno_semanal: 0.06      # pierde 6 % en la semana: no abre mas esa semana
  freno_total: 0.30        # cae 30 % desde el maximo: cierra todo y se detiene hasta que el dueño lo reanude
  comision_papel: 0.0005   # solo para el modo papel (en Demo cobra Binance)
  deslizamiento_papel: 0.0005

publicar:
  repositorio: git@github.com:JuanJoseMA2020/Invest_Platform_TerraInvest.git
  rama: estado
  llave: ~/.ssh/terra_estado
  bot_db: ~/bot/data/bot.db     # base del bot de trading: solo lectura, para mostrar su estado en la pagina
